# Base de datos PostgreSQL para desarrollo local
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: stockflow-db
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    ports:
      - "5432:5432"
    volumes:
      - stockflow-data:/var/lib/postgresql/data

volumes:
  stockflow-data:
