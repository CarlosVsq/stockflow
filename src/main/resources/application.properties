spring.application.name=stockflow

# Conexion a PostgreSQL (se puede sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/stockflow}
spring.datasource.username=${DB_USERNAME:stockflow}
spring.datasource.password=${DB_PASSWORD:stockflow}

# La BD se crea con schema.sql y data.sql; Hibernate solo valida que coincida con las entidades
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
